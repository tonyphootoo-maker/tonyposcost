    <script>
      // Ensure trailing slash for GitHub Pages project sites so relative asset paths (./assets/...) resolve properly
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(window.location.origin + path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
